<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Billable Requirement Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f6f7fb;
      padding: 30px;
      color: #111;
    }

    .box {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.12);
    }

    h1 {
      font-size: 22px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .result {
      margin-top: 20px;
      padding: 15px;
      background: #eef8ff;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
    }

    .note {
      margin-top: 15px;
      font-size: 13px;
      color: #555;
    }
  </style>
</head>
<body>

  <div class="box">
    <h1>Adjusted Billable Requirement</h1>

    <p>Enter your base billable requirement and the number of holidays in the pay period.</p>

    <label>Base billable requirement</label>
    <input id="base" type="number" step="0.5" placeholder="Example: 48">

    <label>Number of holidays in the pay period</label>
    <input id="holidays" type="number" step="1" placeholder="Example: 1">

    <div class="result">
      Adjusted requirement: <span id="answer">--</span>
    </div>

    <div class="note">
      Formula: Base requirement × (1 - 10% per holiday)
    </div>
  </div>

  <script>
    function calculate() {
      var base = parseFloat(document.getElementById("base").value);
      var holidays = parseFloat(document.getElementById("holidays").value);

      if (isNaN(base) || isNaN(holidays)) {
        document.getElementById("answer").innerHTML = "--";
        return;
      }

      var adjusted = base * (1 - (0.10 * holidays));
      document.getElementById("answer").innerHTML = adjusted.toFixed(2) + " hours";
    }

    document.getElementById("base").addEventListener("input", calculate);
    document.getElementById("holidays").addEventListener("input", calculate);
  </script>

</body>
</html>
